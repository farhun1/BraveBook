name: Create Release

# Run it from the Actions tab: it releases the next version (v1.1, v1.2, ...).
# Pushing a tag like v2.0 releases that exact version instead.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pick version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            LAST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+$' | sort -V | tail -1)
            LAST=${LAST:-v1.0}
            MAJOR=$(echo "${LAST#v}" | cut -d. -f1)
            MINOR=$(echo "${LAST#v}" | cut -d. -f2)
            TAG="v${MAJOR}.$((MINOR + 1))"
          fi
          echo "Releasing $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages and accept licenses
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses
          yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode Keystore
        run: |
          mkdir -p $RUNNER_TEMP/keystores
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > $RUNNER_TEMP/keystores/keystore.jks
          if [ ! -f $RUNNER_TEMP/keystores/keystore.jks ]; then
            echo "Failed to decode keystore file"
            exit 1
          fi

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystores/keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PappVersion="${TAG#v}" --stacktrace || { echo "Gradle build failed"; exit 1; }
          mv app/build/outputs/apk/release/app-release.apk "BraveBook_${TAG}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: apk-artifact
          path: BraveBook_${{ steps.version.outputs.tag }}.apk
          compression-level: 5

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download APK Artifact
        uses: actions/download-artifact@v7
        with:
          name: apk-artifact

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: BraveBook_${{ needs.build.outputs.tag }}.apk
          body_path: CHANGE.md
